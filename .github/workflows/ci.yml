name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 构建检查 MDX 语法、内部文档链接和锚点；外部 URL 另行核查
      - name: Build
        run: npm run build

      - name: Verify rendered internal links and assets
        run: python3 scripts/verify_tutorial.py --links-only

  tutorial:
    name: Execute tutorial examples
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm mlir-18-tools qemu-user gdb-multiarch \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf gcc-riscv64-linux-gnu
      - name: Verify shell, LLVM and assembly syntax
        run: python3 scripts/verify_tutorial.py --snippets-only
      - name: Verify ToyC examples and published Token output
        run: python3 scripts/verify_toyc_examples.py
      - name: Execute IR and arithmetic examples
        run: python3 scripts/verify_codegen_examples.py
      - name: Verify QEMU debugging commands
        run: python3 scripts/verify_qemu_debugging.py
      - name: Verify runtime archive
        run: python3 runtime/test_runtime.py
