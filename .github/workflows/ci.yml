name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 构建检查 MDX 语法、内部文档链接和锚点；外部 URL 另行核查
      - name: Build
        run: npm run build

  runtime:
    name: Verify runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Verify runtime archive
        run: python3 runtime/test_runtime.py
